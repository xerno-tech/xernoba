# Publica o servidor da Midori (login + conexão) no Cloudflare
# sempre que algo muda na pasta login/. Também dá para rodar à mão em Actions.
name: Publicar servidor no Cloudflare
on:
  push:
    branches: [main]
    paths: ['login/**']
  workflow_dispatch:
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: login
