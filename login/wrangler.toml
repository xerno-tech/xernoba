# Publicação do servidor da Midori no Cloudflare (feita pelo GitHub Actions)
name = "midori-login"
main = "worker.js"
compatibility_date = "2025-09-01"
workers_dev = true
# segredos (Client Secret do Discord, chaves do IGDB/TURN) ficam só no painel do Cloudflare
keep_vars = true

[vars]
SITE_URL = "https://xerno-tech.github.io/xernoba/"
DISCORD_CLIENT_ID = "1563384635604467742"
DISCORD_GUILD_ID = "1132352204930547807"

[[durable_objects.bindings]]
name = "SINAL"
class_name = "Sinal"

[[durable_objects.bindings]]
name = "DADOS"
class_name = "Dados"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Sinal"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Dados"]
